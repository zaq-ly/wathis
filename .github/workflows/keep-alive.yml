name: Supabase Keep-Alive & Auto-Restore

on:
  schedule:
    # Dua kali sehari (batas pause Free Plan = 7 hari tanpa aktivitas).
    # Menit acak (bukan :00) agar tidak terkena antrean/skip cron GitHub di jam sibuk.
    - cron: '17 3 * * *'
    - cron: '43 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write # untuk me-reset timer 60 hari tanpa commit dummy

concurrency:
  group: supabase-keep-alive
  cancel-in-progress: false

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Ping Supabase (heartbeat + auto-restore)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          APP_URL: ${{ secrets.APP_URL }}
        run: node scripts/keepAlive.js

      - name: Keep scheduled workflow enabled (reset 60-day inactivity timer)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable" \
            && echo "Workflow keep-alive tetap aktif." \
            || echo "::warning::Gagal memanggil API enable workflow."
